# CI for the jlmoya/scilab fork (macOS-first Scilab 2027).
#
# The upstream (Dassault) pipeline lives in .gitlab-ci/*.yml and needs their
# private runners (tags: x86_64-linux-gnu/docker/scilab) plus a private Docker
# registry — on a gitlab.com fork its jobs sit stuck forever, which is exactly
# what broke the README pipeline badge. This fork-native pipeline runs on
# gitlab.com shared runners in a few minutes and guards what this fork changes.
# The upstream config is untouched under .gitlab-ci/ for reference/merges.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - sanity
  - parity

default:
  interruptible: true
  artifacts:
    expire_in: 1 day

# Shell + XML sanity over the scripts and configs this fork maintains.
sanity:scripts:
  stage: sanity
  image: debian:bookworm-slim
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck libxml2-utils > /dev/null
    # the build entry points must at least parse
    - bash -n scilab/configure
    - bash -n scilab/build-macos.sh
    - bash -n scilab/package-macos.sh
    - bash -n scilab/fetch-thirdparty.sh
    - shellcheck -S error scilab/build-macos.sh scilab/fetch-thirdparty.sh
    # pinned-payload hygiene: no unbaked checksums may be committed
    - '! grep -n ''="PENDING"'' scilab/fetch-thirdparty.sh'
    # configs this fork edits must stay well-formed XML
    - xmllint --noout scilab/etc/jvm_options.xml
    - xmllint --noout scilab/modules/console/etc/XConfiguration-general.xml

# Stage-1f-a CMake driver guards (docs/design/build-cmake-driver.md).
# Shared-runner half — a cheap wiring/manifest consistency check (no Mach-O needed)
# plus the parity harness's own unit suite. Stage 1f-a made the driver two-tier: the
# FIRST foreach block builds the 64 baseline module dylibs (46 dirs, tracked by the
# stage1e manifest); the SECOND builds the 21 fold-in OBJECT libs that the
# libscilab/libscilab-cli aggregates consume. Each tier is checked against its own
# source of truth, so a module CMakeLists added-but-not-wired, a dylib/manifest drift,
# a fold-in built-but-not-folded (or vice versa), or a deleted aggregate/executable
# call all fail here. The unit suite is hermetic (pure stdlib + pytest; the acceptance
# tests self-skip without a built macOS tree).
sanity:cmake-driver:
  stage: sanity
  image: debian:bookworm-slim
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pytest > /dev/null
    # GitLab runs all script items in ONE shell with cwd persisting between items, so
    # cd into scilab ONCE and keep every path below relative to it (same model as
    # parity:cmake-drop-in) — a second `cd scilab/...` would compound to scilab/scilab/... .
    - cd scilab
    - |
      set -e   # a multi-line item's status is its LAST line's rc; without this an
               # intermediate diff mismatch would be masked by the final `test` passing.
      # Split the driver's foreach into its two blocks (blk 1 = dylib dirs, blk 2 =
      # fold-in dirs), tagging each module token with its block number.
      awk '/^foreach\(m/{blk++;inb=1;next} /^endforeach/{inb=0;next} inb{sub(/#.*/,"");if($0~/add_subdirectory/)next;gsub(/\)/," ");for(i=1;i<=NF;i++)print blk,$i}' CMakeLists.txt > /tmp/blocks.txt
      awk '$1==1{print $2}' /tmp/blocks.txt | sort > /tmp/dylib_fe.txt
      awk '$1==2{print $2}' /tmp/blocks.txt | sort > /tmp/foldin_fe.txt
      cat /tmp/dylib_fe.txt /tmp/foldin_fe.txt | sort > /tmp/all_fe.txt
      ls modules/*/CMakeLists.txt | sed 's|modules/||; s|/CMakeLists.txt||' | sort > /tmp/dirs.txt
      grep '^| libsci' cmake/stage1e-manifest.md | awk -F'|' '{print $3}' | tr -d ' ' | sort -u > /tmp/manifest.txt
      # fold-in truth = the aggregate's _scilab_fold_objects (sci<m>-obj -> <m>)
      sed -n '/set(_scilab_fold_objects/,/)/p' modules/CMakeLists.txt | grep -oE 'sci[a-z_]+-obj' | sed 's/^sci//; s/-obj$//' | sort > /tmp/foldset.txt
      # A. every add_subdirectory(modules/X) has a real modules/X/CMakeLists.txt (and vice versa)
      diff /tmp/all_fe.txt /tmp/dirs.txt
      # B. the dylib tier is exactly the manifest's dylib dirs ...
      diff /tmp/dylib_fe.txt /tmp/manifest.txt
      # C. ... and the fold-in tier is exactly what the aggregates fold in
      diff /tmp/foldin_fe.txt /tmp/foldset.txt
      # D. the manifest still enumerates exactly the 64 baseline dylibs
      test "$(grep -c '^| libsci' cmake/stage1e-manifest.md)" = 64
      # E. both aggregates and both executables are still declared (a deleted call would
      #    silently shrink the native app the parity job rebuilds). Anchored to call
      #    sites (^ + optional indent), so comment mentions of the helpers do not count.
      test "$(grep -cE '^[[:space:]]*scilab_aggregate\(' modules/CMakeLists.txt)" = 2
      test "$(grep -cE '^[[:space:]]*scilab_executable\(' CMakeLists.txt)" = 2
      # F. the Java bridge is wired: scilab_java_bridge() called + sci-java-all on
      #    drop-in-all (a deleted call would silently drop the 24 jars from the build the
      #    parity job then fails to find).
      grep -q 'scilab_java_bridge()' CMakeLists.txt
      grep -q 'add_dependencies(drop-in-all sci-java-all)' CMakeLists.txt
      # G. Stage-1f-c codegen is wired: version.h generation (ScilabConfigure) + the help
      #    post-step (scilab_help_target). A deleted include would silently drop the
      #    generated version.h or the doc target.
      grep -q 'include(cmake/ScilabConfigure.cmake)' CMakeLists.txt
      grep -q 'scilab_help_target()' CMakeLists.txt
      # H. Retire-configure RC-a is wired: CMake computes + generates machine.h. The native
      #    parity job would also catch a deleted include (verified: dropping header_defines
      #    from a candidate against the armed baseline fails with "header_defines section
      #    missing in candidate", rc=1) — this grep catches it here instead, in the cheap
      #    sanity job, minutes before the full native build would.
      grep -q 'include(cmake/ScilabMachineHeader.cmake)' CMakeLists.txt
      # I. Retire-configure RC-b is wired: the compiler-flag POLICY is computed in
      #    cmake/ScilabFlags.cmake and consumed by ScilabModule.cmake, rather than
      #    hardcoded as literal lists. Deleting the include would leave the module
      #    helper setting flags from now-empty variables -- every TU would silently
      #    lose -O2/-fwrapv/-std=, which the native flag gate catches but only after
      #    a full build. These greps catch it here in seconds.
      grep -q 'include(cmake/ScilabFlags.cmake)' CMakeLists.txt
      grep -q 'SCILAB_C_FLAGS' cmake/ScilabModule.cmake
      # J. Retire-configure RC-c is wired: CMake generates the configure-substituted
      #    files. A deleted include is invisible during coexistence -- configure still
      #    produces them, so the build keeps working and only RC-e would discover it.
      grep -q 'include(cmake/ScilabGeneratedFiles.cmake)' CMakeLists.txt
      # K. Retire-configure RC-d is wired: CMake drives the macros build, AND the
      #    macros target depends on a freshly-built interpreter. Both greps matter:
      #    without the include there is no target; without the dependency the target
      #    would silently compile .bin files with a STALE scilab-cli-bin and exit 0
      #    -- the same silent-divergence class the target's fail-loudly design exists
      #    to prevent, reached by a different route.
      grep -q 'include(cmake/ScilabMacros.cmake)' CMakeLists.txt
      grep -q 'add_dependencies(macros drop-in-scilab-cli-bin)' CMakeLists.txt
    - cd build-parity && python3 -m pytest tests/ -q

# Native half — the real Stage-1f-b gate: build the WHOLE app under CMake from the
# configured tree (drop-in-all builds the libscilab/libscilab-cli aggregates + the
# scilab-bin/scilab-cli-bin executables + the 24 Java jars via sci-java-all), drop it all
# into place, and hold it at parity with the committed autotools baseline —
# symbols/deps/install_name + LC_RPATH + the 24-jar content manifest + the per-TU flag
# facts from compile_commands.json. The aggregate/executable/rpath/jar coverage is
# automatic: they ride drop-in-all and the capture fingerprints every .libs/ artifact and
# every modules/*/jar/*.jar (the runner has Ant + the JDK). RC-d's `macros` target does
# NOT ride along this way — it is deliberately opt-in (the `doc`-target precedent), so
# without an explicit purge+rebuild here the capture would happily fingerprint .bin/lib
# files an EARLIER autotools run produced on this persistent runner, and the
# content-manifest dimension would gate nothing CMake actually did (see the inline
# comment at the build step below). Any regression
# fails the pipeline. Needs a self-hosted macOS
# arm64 runner (shell executor) whose persistent workdir is configured + built per
# docs/design/build-cmake-driver.md — shared gitlab.com runners can neither build nor
# fingerprint Mach-O. Set the project variable SCILAB_NATIVE_RUNNER=1 only while such a
# runner is registered; without it the job is not created (a tagged job with no runner
# would sit stuck and break the pipeline badge — the failure mode this fork-native
# pipeline exists to avoid).
parity:cmake-drop-in:
  stage: parity
  rules:
    - if: '$SCILAB_NATIVE_RUNNER == "1"'
  tags:
    - scilab-macos-arm64
  variables:
    GIT_CLEAN_FLAGS: none  # persistent tree — never git-clean config.status/.libs/build-cmake
  script:
    - cd scilab
    - test -f config.status  # CMake consumes the configure-generated machine.h/version.h
    - cmake -S . -B build-cmake -DCMAKE_Fortran_COMPILER=gfortran
    - cmake --build build-cmake --target drop-in-all -j
    # RC-d final-review Important 1: the macro .bin files must be built BY CMAKE for the
    # content manifest to mean anything -- capturing a tree whose macros an earlier
    # autotools run produced (this runner's workdir is persistent, GIT_CLEAN_FLAGS: none
    # above) would compare autotools against itself and report PARITY OK regardless of
    # whether cmake/ScilabMacros.cmake's COMMAND even still works. Purge both *.bin AND
    # lib: genlib is incremental (sci_genlib.cpp:263-279) and skips any .sci whose md5
    # still matches its lib entry, so without the lib purge too this is a no-op that
    # reuses the stale files instead of rebuilding them.
    - find modules -path '*/macros/*' -name '*.bin' -delete
    - find modules -path '*/macros/*' -name 'lib'   -delete
    - cmake --build build-cmake --target macros
    - cd build-parity
    - python3 -m parity.capture .. /tmp/cand-ci.json cand
    - python3 -m parity.diff baseline-autotools.json /tmp/cand-ci.json
    # RC-b: expectations are DERIVED from the autotools Makefiles and frozen in the
    # baseline, so the check now needs the baseline + the source root. The old 1-arg
    # form raises IndexError.
    - python3 -m parity.flagfacts_check ../build-cmake/compile_commands.json baseline-autotools.json ..

# Regression guard for the UB-miscompile class: rand() returned Inf because
# durands()'s modulus loop relied on signed-integer overflow, which clang/gcc
# miscompile at -O2 (see docs/design/modernization-assessment.md). Guard both
# the shipped source and the algorithm itself.
guard:ub-miscompile:
  stage: sanity
  image: gcc:13
  script:
    # the overflow-safe modulus loop is still in the shipped generator
    - grep -q 'm2 <= INT_MAX / itwo' scilab/modules/elementary_functions/src/c/basic_functions.c
    # the class-level guard flag is still in the build policy (source and generated configure) —
    # -fwrapv, not -fno-strict-overflow: clang expands the latter to -fwrapv-pointer, which
    # explodes compile times on template-heavy TUs (ast arguments.cpp went 3.7s -> >60min)
    - grep -q -- '-O2 -fwrapv"' scilab/configure.ac
    - grep -q -- '-O2 -fwrapv"' scilab/configure
    # the fixed algorithm must produce identical, finite, in-range values at -O0 and -O2
    - gcc -O0 -o /tmp/guard_O0 .gitlab-ci/fork/durands_guard.c -lm
    - gcc -O2 -o /tmp/guard_O2 .gitlab-ci/fork/durands_guard.c -lm
    - /tmp/guard_O0 > /tmp/out_O0
    - /tmp/guard_O2 > /tmp/out_O2
    - diff /tmp/out_O0 /tmp/out_O2
